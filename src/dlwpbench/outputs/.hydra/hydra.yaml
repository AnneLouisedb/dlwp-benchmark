hydra:
  run:
    dir: outputs/${model.name}/
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    root:
      level: ERROR
    disable_existing_loggers: true
  job_logging:
    version: 1
    root:
      level: ERROR
    disable_existing_loggers: true
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - model=diffusion_modernunet
    - model.type=DiffMUNetHPX
    - model.name=
    - model.mesh=healpix
    - data=half_hpx32
    - training=diffusion
    - model.hidden_channels=[128,128,256,1024]
    - model.context_size=1
    - training.learning_rate=0.0001
    - training.sequence_length=2
    - validation.sequence_length=14
    - model.prognostic_channels=13
    - training.min_noise_std=0.001
    - model.num_refinement_step=50
    - training.num_refinement_steps=50
    - training.epochs=600
    - training.batch_size=64
    - validation.batch_size=64
    - data.train_start_date=1990-01-01
    - training.save_model=False
    - training.ACDM=True
    - device=cuda:0
  job:
    name: train
    chdir: null
    override_dirname: data.train_start_date=1990-01-01,data=half_hpx32,device=cuda:0,model.context_size=1,model.hidden_channels=[128,128,256,1024],model.mesh=healpix,model.name=,model.num_refinement_step=50,model.prognostic_channels=13,model.type=DiffMUNetHPX,model=diffusion_modernunet,training.ACDM=True,training.batch_size=64,training.epochs=600,training.learning_rate=0.0001,training.min_noise_std=0.001,training.num_refinement_steps=50,training.save_model=False,training.sequence_length=2,training=diffusion,validation.batch_size=64,validation.sequence_length=14
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /gpfs/home6/adboer/dlwp-benchmark/src/dlwpbench
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /gpfs/home6/adboer/dlwp-benchmark/src/dlwpbench/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /gpfs/home6/adboer/dlwp-benchmark/src/dlwpbench/outputs
    choices:
      model: diffusion_modernunet
      data: half_hpx32
      testing: default
      validation: default
      training: diffusion
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: disabled
      hydra/hydra_logging: disabled
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
